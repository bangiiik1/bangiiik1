<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>flappy bird</title>
<style>
body {
background-color: black;
overflow: hidden;
position: fixed;
}
#game {
background-color: #aaffff;
}
</style>
</head>
<body>
<canvas id="game" width=500 height=500></canvas>
<script>
var y = 234
var vy = 0
var jumpheight = 10
var gravity = 0.5
var game = document.getElementById("game")
var ctx = game.getContext("2d")
var firstatt = true
var gameover = true
var speed = 7
var shirina = 200/2
var tolshina = 20
var playerimg = new Image()
var trubi = []
var score = 0
var highscore = 0
playerimg.src = "player.png"
ctx.imageSmoothingEnabled = false
window.addEventListener("mousedown",()=>{
vy = -jumpheight; if (gameover) {gameover = false; score = 0}})
window.addEventListener("touchstart",(e)=>{
e.preventDefault(); vy = -jumpheight; if (gameover) {gameover = false; score = 0}})
if (!localStorage.getItem("flappybirdhighscore")) {localStorage.setItem("flappybirdhighscore",0)}
highscore = localStorage.getItem("flappybirdhighscore")
if (window.innerHeight < window.innerWidth) {
game.style.width = window.innerHeight + "px"
game.style.height = window.innerHeight + "px"
} else {
game.style.width = window.innerWidth + "px"
game.style.height = window.innerwidth + "px"
}
setInterval(()=>{
if (gameover) {return}
var projom = Math.random()*500
var truba1 = [500,0,tolshina,projom - shirina]
var truba2 = [500,projom + shirina,tolshina,500-(projom+shirina)]
trubi.push(truba1)
trubi.push(truba2)
},1500)
function touching(shape1,shape2) {
if (shape1[0] + shape1[2] < shape2[0] ||
shape2[0] + shape2[2] < shape1[0] ||
shape1[1] + shape1[3] < shape2[1] ||
shape2[1] + shape2[3] < shape1[1]
) {return false} else {return true}
}
function lose() {
gameover = true;
y = 234; vy = 0;
firstatt = false;
trubi = [];
if (score > highscore) {localStorage.setItem("flappybirdhighscore",score); highscore = score}
}
function upd() {
if (gameover) {return}
vy += gravity
y += vy
for (i=0;i<trubi.length;i++) {
var truba = trubi[i]
truba[0] -= speed
if (truba[0] <= -tolshina) {trubi.splice(i,1); score += 0.5}
if (touching(truba,[0,y,32,32])) {lose()}
}
if (y < 0) {vy = 0; y = 0}
if (y >= 468) {lose()}
}
function draw() {
ctx.clearRect(0,0,500,500)
ctx.fillStyle = "green"
for (i=0;i<trubi.length;i++) {
var truba = trubi[i]
ctx.fillRect(truba[0],truba[1],truba[2],truba[3])
}
ctx.drawImage(playerimg,0,y,32,32)
if (gameover) {
ctx.fillStyle = "black"
ctx.font = "20px sans-serif"
if (firstatt) {ctx.fillText("Нажми, чтобы начать",150,266)} else {ctx.fillText("Нажми, чтобы играть снова",150,266)}
}
ctx.fillText("Счёт: " + Math.round(score),200,20)
ctx.fillText("Рекорд: " + highscore,200,40)
}
function loop() {
upd()
draw()
requestAnimationFrame(loop)
}
loop()
</script>
</body>
</html>
