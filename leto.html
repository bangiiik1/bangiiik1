<!DOCTYPE html>
<html>
<head>
    <title>До лета осталось</title>
    <style>
        body { font-family: sans-serif; }
        h1, p, .container { display: flex; justify-content: center; }
        h1 { font-size: 6vh; }
        p { font-size: 4vh; }
        
        #pro {
            width: 80vw;
            height: 5vh;
            background-color: #eee;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
        }
        #task {
            width: 0%; /* Начальная ширина */
            height: 100%;
            background-color: #00ff00;
            transition: width 0.5s; /* Плавность */
        }
    </style>
</head>
<body>
    <h1>Таймер лета</h1>
    <p id="t">Загрузка...</p>
    <div id="pro"><div id="task"></div></div>
    <p id="c"></p>

<script>
    const c = document.getElementById("c");
    const task = document.getElementById("task");
    const t = document.getElementById("t");

    setInterval(() => {
        const now = new Date();
        const year = now.getFullYear();
        
        // Определяем дату начала лета (1 июня)
        let letoStart = new Date(year, 5, 1); 
        if (now > new Date(year, 7, 31)) {
            letoStart = new Date(year + 1, 5, 1); // Если лето уже прошло, берем следующее
        }

        // Определяем дату конца лета (31 августа)
        let letoEnd = new Date(letoStart.getFullYear(), 8, 0);

        const isNowLeto = now >= new Date(year, 5, 1) && now <= new Date(year, 7, 31);
        
        if (!isNowLeto) {
            // Считаем дни ДО лета
            const diff = letoStart - now;
            const days = Math.floor(diff / 86400000);
            t.textContent = "До лета осталось " + days + " дней";
            
            // Прогресс (приблизительно от начала года до 1 июня)
            const startPoint = new Date(letoStart.getFullYear(), 0, 1);
            const totalWait = letoStart - startPoint;
            const currentWait = now - startPoint;
            const progress = Math.max(0, Math.min(100, (currentWait / totalWait) * 100));
            task.style.width = progress + "%";

            c.textContent = days <= 30 ? "Ура, скоро лето 😎" : "";
        } else {
            // Считаем дни ДО КОНЦА лета
            const diff = letoEnd - now;
            const days = Math.floor(diff / 86400000);
            t.textContent = "До конца лета осталось " + days + " дней";
            
            // Прогресс внутри самого лета (92 дня)
            const totalSummer = letoEnd - letoStart;
            const passedSummer = now - letoStart;
            const progress = 100 - (passedSummer / totalSummer * 100);
            task.style.width = progress + "%";

            c.textContent = days <= 14 ? "Внимание, скоро конец лета ⚠" : "";
        }
    }, 1000);
</script>
</body>
</html>
