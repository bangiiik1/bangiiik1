<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
#game {
border: 5px solid #ffffff;
}
body {
display: flex;
justify-content: center;
align-items: center;
background-color: #000000;
flex-direction: column;
overflow: hidden;
position: fixed;
}
.actions {
width: 100px;
height: 40px;
border: 5px solid #ff8800;
}
.acttext {
color: #ff8800;
}
#actions {
display: flex;
gap: 10px;
position: relative;
top: 30px;
}
#hpbar {
position: relative;
top: 20px;
background-color: red;
width: 200px;
height: 20px;
}
#task {
background-color: yellow;
width: 100%;
height: 20px;
}
#hpbar2 {
position: relative;
background-color: red;
width: 200px;
height: 20px;
}
#task2 {
background-color: lime;
width: 100%;
height: 20px;
}
img {
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    -ms-interpolation-mode: nearest-neighbor;
	position: relative;
	top: 0vh;
}
:fullscreen img {
transform: scale(0.6)
}
@keyframes anim {
0%, 100% {opacity: 0; transform: translateY(0px)}
15% {opacity: 1}
50% {transform: translateY(-10px)}
}
#dt {
position: fixed;
top: -30px;
animation: anim 0.5s linear;
color: red;
font-size: 100px
}
#joy {
position: absolute;
width: 200px;
height: 200px;
background-color: grey;
border-radius: 50%;
top: 60vh;
left: -10vw;
z-index: 9999;
opacity: 0.6;
}
#stick {
position: relative;
width: 70px;
height: 70px;
background-color: white;
border-radius: 50%;
z-index: 999999;
opacity: 1;
}
#bh {
position:fixed;
top: 70vh;
left: 100vw;
}
#bz {
font-size: 100px;
width: 150px;
height: 150px;
color: white;
background-color: grey;
border-radius: 50%;
}
:fullscreen #gamecontainer {

display: flex;
justify-content: center;
align-items: center;
background-color: #000000;
flex-direction: column;
min-height: 100vh;
width: 100vw;
transform: scale(0.6)
}
#gamecontainer {
display: flex;
justify-content: center;
align-items: center;
background-color: #000000;
flex-direction: column;
height: 100vh;
width: 100vw;
}
</style>
<title>bossfight</title>
</head>
<body>
<div id="gamecontainer">
<div id="bh"><button id="bz">z</button></div>
<div id="joy"><div id="stick"></div></div>
<p id="dt" hidden></p>
<div id="hpbar2" hidden><div id="task2"></div></div>
<img src="enemy.svg" width=200 height=200 id="img"></img>
<canvas width=300 height=300 id="game"></canvas>
<div id="hpbar"><div id="task"></div></div>
<div id="actions">
<div id="fight" class="actions"><p class="acttext">❤ битва</p></div>
<div id="act" class="actions"><p class="acttext">действие</p></div>
<div id="item" class="actions"><p class="acttext">предмет</p></div>
<div id="mercy" class="actions"><p class="acttext">пощада</p></div>
</div>
</div>
<script>
// получаю элементы
var fight = document.getElementById("fight")
var act = document.getElementById("act")
var item = document.getElementById("item")
var mercy = document.getElementById("mercy")
var game = document.getElementById("game")
var texts = document.getElementsByClassName("acttext")
var acts = document.getElementsByClassName("actions")
var task = document.getElementById("task")
var task2 = document.getElementById("task2")
var hpbar2 = document.getElementById("hpbar2")
var img = document.getElementById("img")
var dt = document.getElementById("dt")
var stick = document.getElementById("stick")
var joy = document.getElementById("joy")
var bz = document.getElementById("bz")
// переменные (или константы)
var selected = 0
var phase = 1
var aimpos = 0
var firstturn = true
var turn = 0
var todraw = []
var ctx = game.getContext("2d")
var enemyhp = 100
var hp = 100
var isenemyturn = false
var plr = [0,0,20,20,"red"]
var keys = {}
var speed = 5
var attacks = []
var aim = []
var text = [""]
var dmg = 0
var dmg2 = 1
var acttimes = 0
var textspeed = 100
var texttowrite = [""]
var line = 0
var food = 3
var switchcd = 0
var seengrymsg = false
var correcttouch
acts[selected].style.border = "5px solid #ffff00"
joy.style.width = "200px"
joy.style.height = "200px"
stick.style.width = "70px"
stick.style.height = "70px"
game.width = 420
game.height = 170

function tm(touches) {
var rect = joy.getBoundingClientRect()
var rect2 = stick.getBoundingClientRect()
var center = [rect.left + rect.width / 2,rect.top + rect.height / 2]
var minimum = 20
for (i=0;i<touches.length;i++) {
var t = touches[i]
if (t.clientX < window.innerWidth/2) {correcttouch = t; break}
}
if (correcttouch.clientX < window.innerWidth/2) {
var dpos = [correcttouch.clientX - center[0], correcttouch.clientY - center[1]]
stick.style.position = "fixed"
stick.style.left = correcttouch.clientX - window.innerWidth* 0.2 +"px"
stick.style.top = correcttouch.clientY - window.innerHeight* -0.01 +"px"
keys.ArrowRight = dpos[0] > minimum
keys.ArrowLeft = dpos[0] < -minimum
keys.ArrowUp = dpos[1] < -minimum
keys.ArrowDown = dpos[1] > minimum
if (switchcd <= 0) {
if (dpos[0] > minimum) {switchcd = 30; next(1)}
else if (dpos[0] < -minimum) {switchcd = 30; next(-1)}
}
}
}
bz.addEventListener("touchstart",()=>{z()})
window.addEventListener("keydown",(e)=>{keys[e.key] = true})
window.addEventListener("keyup",(e)=>{keys[e.key] = false})
window.addEventListener("touchmove",(e)=>{tm(e.touches); e.preventDefault()}, {passive: false})
window.addEventListener("touchend",(e)=>{stick.style.top = "70px";stick.style.left = "70px";
stick.style.position = "relative";
keys = {}})
function normalized(vector) {
var l = Math.sqrt(vector[0]*vector[0] + vector[1]*vector[1])
if (l === 0) {return [0,0]}
return [vector[0]/l,vector[1]/l]
}
function write() {
if (text[line] != texttowrite[line]) {
text[line] += texttowrite[line][text[line].length]
setTimeout(write,textspeed)
} else if (texttowrite[line+1]) {
line += 1;
text[line] = "";
setTimeout(write,textspeed)
} else {}
}
function resize(x,y) {
var xs = game.width
var ys = game.height
var interval = setInterval(()=>{
if (xs == x && ys == y) {clearInterval(interval)}
if (xs < x) {xs += 1} else {xs -=1};
game.width = xs;
if (ys < y) {ys += 1} else {ys -=1};
game.height = ys;
},1)
}
document.body.addEventListener("touchstart",(e)=>{document.documentElement.requestFullscreen();})
// проверка на касание двух прямоугольников
function touch(shape1,shape2) {
var x1 = shape1[0]
var y1 = shape1[1]
var w1 = shape1[2]
var h1 = shape1[3]
var x2 = shape2[0]
var y2 = shape2[1]
var w2 = shape2[2]
var h2 = shape2[3]
if (
x1 + w1 < x2 ||
x2 + w2 < x1 ||
y1 + h1 < y2 ||
y2 + h2 < y1
) {return false} else {return true}
}
function myturn() {
if (firstturn) {
texttowrite = ["Стикман преграждает путь!"]
write()
}
if (acttimes >= 10) {texttowrite = ["Стикман щадит вас!"]; text = [""]; line = 0
write()}
if (enemyhp <= 65 && !seengrymsg) {
texttowrite = ["Стикман злится.","Его атака повышена!"]; text = [""]; line = 0
seengrymsg = true
write()}
}
// паттерны
function p1() {
var stop = false
var interval = setInterval(()=>{
if (stop) {clearInterval(interval)}
var attack = [300,Math.random()*300,10,10,0,80]
attacks.push(attack)
},100)
setTimeout(()=>{stop = true;
setTimeout(()=>{
isenemyturn = false
resize(420,170)
turn = 0;
myturn()
},1000)
},5000)
}
function p2() {
var stop = false
var interval = setInterval(()=>{
if (stop) {clearInterval(interval)}
var r = 0.5>Math.random()
var attack = [300,Math.random()*300,10,10,1,80]
if (r) {attack = [-10,Math.random()*300,10,10,2,80]}
attacks.push(attack)
},100)
setTimeout(()=>{stop = true;
setTimeout(()=>{
isenemyturn = false
resize(420,170)
turn = 0;
myturn()
},1000)
},5000)
}
function p3() {
var stop = false
var interval = setInterval(()=>{
if (stop) {clearInterval(interval)}
var r = 0.5>Math.random()
var attack = [300,Math.random()*300,10,10,3,150]
if (r) {attack = [-10,Math.random()*300,10,10,3,150]}
var idk = normalized([plr[0] - attack[0],plr[1] - attack[1]])
attack[6] = idk[0]
attack[7] = idk[1]
attacks.push(attack)
},enemyhp < 16 ? 50 : 100)
setTimeout(()=>{stop = true;
setTimeout(()=>{
isenemyturn = false
resize(420,170)
turn = 0;
myturn()
},1000)
},5000)
}
function enemyturn() {
texttowrite = []
text = [""]
isenemyturn = true
if (phase == 1) {p1()} else if (phase == 2) {p2()} else {p3()}
}
function animation() {
var indx = Number(img.src.charAt(img.src.length-5))
if (isNaN(indx)) {indx = 0}
if (indx <= 2) {indx += 1; img.src = "hurt" + indx + ".svg";
setTimeout(animation,100)} else {indx = 0}
}
function dealdmg() {
firstturn = false
dmg = Math.max(dmg,1)
if (enemyhp <= 65) {phase=3}
animation()
hpbar2.hidden = false
setTimeout(()=>{img.src = "enemy.svg"},400)
setTimeout(()=>{
img.style.left = "20px";
enemyhp -= dmg;
task2.style.width = enemyhp + "%";
dt.hidden = false
dt.textContent = Math.round(dmg) + ""
dt.classList.add("anim")
setTimeout(()=>{dt.classList.remove("anim");dt.hidden = true},500)
},600)
setTimeout(()=>{img.style.left = "-20px"},700)
setTimeout(()=>{img.style.left = "20px"},800)
setTimeout(()=>{img.style.left = "0px"},900)
setTimeout(()=>{hpbar2.hidden = true},1200)
}
function z() {
if (turn == 0) {text = [""]
texttowrite = [""]
line=0}
if (selected == 0 && turn == 0) {
turn = 1
var topush = [0,0,15,170,"white"]
var topush2 = [[210,0,15,170,"red"],[70,0,15,170,"yellow"],[350,0,15,170,"yellow"],[280,0,15,170,"green"],[140,0,15,170,"green"]]
aim = topush
for (i=0;i<topush2.length;i++) {todraw.push(topush2[i])}
aimpos = 0
}
else if (turn == 1 && !isenemyturn) {
turn = 2;
dmg = 15 - (Math.abs(210-aimpos)/10)
dealdmg()
resize(300,300);
todraw.splice(0);
aim = []
setTimeout(()=>{enemyturn();isenemyturn = true},1000);
} else if (turn == 0 && selected == 1) {
turn = 2
if (acttimes == 0 || acttimes >= 3) {
firstturn = false
texttowrite = ["Вы позвали на помощь...","Но никто не пришёл."]
write()
setTimeout(()=>{enemyturn();resize(300,300);turn = 2;texttowrite = [];text = []},5000)
} else if (acttimes == 1)
{texttowrite = ["Вы позвали на помощь...","С каких это пор у тебя есть"," тот, кто мог бы тебе помочь?"];
write();
setTimeout(()=>{enemyturn();resize(300,300);turn = 2;texttowrite = [];text = []},10000)
} else if (acttimes == 2)
{texttowrite = ["Вы бесите его.","Атака стикмана повышена!"];
phase = 2
write();
setTimeout(()=>{enemyturn();resize(300,300);turn = 2;texttowrite = [];text = []},5000)
}
acttimes++} else if (turn == 0 && selected == 2) {
if (food <= 0) {texttowrite = ["У вас не осталось еды."];write();
return}
texttowrite = ["Вы скушали финики.","Восстановлено 15 ОЗ."]
hp = Math.min(hp + 15,100)
food -= 1
turn = 2
if (hp == 100) {texttowrite[1] = "Ваши ОЗ восполнены до предела!"}
write()
task.style.width = hp + "%"
setTimeout(()=>{enemyturn(); turn = 2; resize(300,300);},5000)
} else if (turn == 0 && selected == 3) {if (acttimes >= 10) {alert("Победа!");location.reload()}
}}
function next(num) {
if (turn != 0) {return}
selected += num
if (selected == 4) {selected = 0}
if (selected == -1) {selected = 3}
for (i=0;i<=3;i++) {texts[i].textContent = texts[i].textContent.replace("❤ ","")}
for (i=0;i<=3;i++) {acts[i].style.border = "5px solid #ff8800"}
acts[selected].style.border = "5px solid #ffff00"
texts[selected].textContent = "❤ " + texts[selected].textContent
}
window.addEventListener("keydown",(event)=>{
if (event.key == "ArrowRight") {next(1)}
else if (event.key == "ArrowLeft") {next(-1)}
else if (event.key == "z") {z()}
})
//рендеринг
function draw() {
ctx.clearRect(0,0,9999,9999)
ctx.font = "bold 24px monospace"
ctx.fillStyle = "white"
for (i=0;i<text.length;i++) {
ctx.fillText(text[i],10,i*24+20)
}
for (i=1;i <= todraw.length;i++) {
ctx.fillStyle = todraw[i-1][4]
ctx.fillRect(todraw[i-1][0], todraw[i-1][1],todraw[i-1][2],todraw[i-1][3])
}
if (isenemyturn) {
ctx.fillStyle = "white"
for (i=1;i <= attacks.length;i++) {
ctx.fillRect(attacks[i-1][0], attacks[i-1][1],attacks[i-1][2],attacks[i-1][3])
}
ctx.fillStyle = plr[4]
ctx.fillRect(plr[0],plr[1],plr[2],plr[3])
}
ctx.fillStyle = "white"
ctx.fillRect(aim[0],aim[1],aim[2],aim[3])
}
function gameupd() {
var way = [0,0]
if (keys.ArrowUp) {way[1] -= 1}
if (keys.ArrowDown) {way[1] += 1}
if (keys.ArrowLeft) {way[0] -= 1}
if (keys.ArrowRight) {way[0] += 1}
way = normalized(way)
plr[0] += way[0]*speed; plr[1] += way[1]*speed
plr[0] = Math.min(plr[0],300-plr[2])
plr[0] = Math.max(plr[0],0)
plr[1] = Math.min(plr[1],300-plr[3])
plr[1] = Math.max(plr[1],0)
// двигаем атаки
for (i=0;i<attacks.length;i++) {
var a = attacks[i]
a[5] -= 1
if (a[5] <= 0) {attacks.splice(i,1); continue}
if (a[4] == 0) { // a[4] это тип поведения атаки
a[0] -= 8
}
if (a[4] == 1) {a[0] -= 4}
if (a[4] == 2) {a[0] += 4}
if (a[4] == 3) {a[0] += a[6]*4; a[1] += a[7]*4}
if (touch(plr,a)) {hp -= dmg2}
task.style.width = hp + "%"
}
if (turn == 1) {
aimpos += 5
aim = [aimpos,10,15,340]
if (aimpos >= 420) {
dmg = 1;
turn = 2;
aim = []
dealdmg()
isenemyturn = true
resize(300,300)
setTimeout(()=>{enemyturn()},1000)
todraw.splice(0);
}
}
if (switchcd > 0) {switchcd -= 1}
if (hp <= 0) {alert("Не повезло");location.reload();}
if (enemyhp <= 0) {alert("Победа!");location.reload();}
}
function loop() {
draw()
gameupd()
requestAnimationFrame(loop)
}
loop()
myturn()
</script>
</body>
</html>
